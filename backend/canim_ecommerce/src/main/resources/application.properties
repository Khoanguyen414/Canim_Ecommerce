spring.application.name=canim_ecommerce

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:[http://localhost:*,http://127.0.0.1:*}](http://localhost:*,http://127.0.0.1:*})

server.port=${PORT:8000}
server.servlet.context-path=/canim_ecommerce

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.flyway.url=${SPRING_DATASOURCE_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
spring.flyway.ignore-migration-patterns=*:missing

security.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
security.jwt.access-token-expiration-minutes=10
security.jwt.refresh-token-expiration-days=1

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.storage.mode=${APP_STORAGE_MODE:cloudinary}
app.storage.public-url=${APP_STORAGE_PUBLIC_URL:http://localhost:8000/canim_ecommerce/uploads}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s

order.pending-expiration-hours=24
order.auto-cancel-fixed-delay-ms=300000

payment.environment=${PAYMENT_ENV:sandbox}

payment.vnpay.enabled=true
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:}
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
payment.vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8000/canim_ecommerce/payments/vnpay/ipn}

payment.momo.enabled=true
payment.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.momo.endpoint=${MOMO_ENDPOINT:}
payment.momo.return-url=${MOMO_RETURN_URL:http://localhost:5173/payment/momo-return}
payment.momo.notify-url=${MOMO_NOTIFY_URL:http://localhost:8000/canim_ecommerce/payments/momo/notify}

# --- QR cá nhân demo đồ án ---

# Giá trị thật nên đặt trong .env hoặc biến môi trường, không hard-code trong source code.

payment.personal-qr.vietqr-template=${PAYMENT_PERSONAL_QR_VIETQR_TEMPLATE:compact2}

payment.personal-qr.momo.enabled=${PAYMENT_PERSONAL_QR_MOMO_ENABLED:true}
payment.personal-qr.momo.account-name=${PAYMENT_PERSONAL_QR_MOMO_ACCOUNT_NAME:}
payment.personal-qr.momo.phone=${PAYMENT_PERSONAL_QR_MOMO_PHONE:}
payment.personal-qr.momo.wallet-account-number=${PAYMENT_PERSONAL_QR_MOMO_WALLET_ACCOUNT_NUMBER:}
payment.personal-qr.momo.vietqr-bank-bin=${PAYMENT_PERSONAL_QR_MOMO_VIETQR_BANK_BIN:970454}

payment.personal-qr.vnpay.enabled=${PAYMENT_PERSONAL_QR_VNPAY_ENABLED:true}
payment.personal-qr.vnpay.account-name=${PAYMENT_PERSONAL_QR_VNPAY_ACCOUNT_NAME:}
payment.personal-qr.vnpay.bank-name=${PAYMENT_PERSONAL_QR_VNPAY_BANK_NAME:}
payment.personal-qr.vnpay.account-number=${PAYMENT_PERSONAL_QR_VNPAY_ACCOUNT_NUMBER:}
payment.personal-qr.vnpay.vietqr-acquirer-id=${PAYMENT_PERSONAL_QR_VNPAY_VIETQR_ACQUIRER_ID:970436}

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.enabled=false

app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
