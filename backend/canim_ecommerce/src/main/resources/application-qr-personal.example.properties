# Sao chép các dòng sau vào application.properties local hoặc set biến môi trường.
# Dùng cho thanh toán QR ví/ngân hàng cá nhân — phù hợp demo đồ án tốt nghiệp.
# Không nhập thông tin cá nhân thật vào file example để tránh lộ dữ liệu khi commit.

# Ảnh QR: đặt tại frontend/public/qr/
# Xem docs/HUONG_DAN_THANH_TOAN_QR_CA_NHAN.md

payment.personal-qr.vietqr-template=${PAYMENT_PERSONAL_QR_VIETQR_TEMPLATE:compact2}

payment.personal-qr.momo.enabled=${PAYMENT_PERSONAL_QR_MOMO_ENABLED:true}
payment.personal-qr.momo.account-name=${PAYMENT_PERSONAL_QR_MOMO_ACCOUNT_NAME:YOUR_MOMO_NAME}
payment.personal-qr.momo.phone=${PAYMENT_PERSONAL_QR_MOMO_PHONE:YOUR_MOMO_PHONE}
# STK đầy đủ từ MoMo → Nhận tiền, thường có dạng 99MM...
# Không dùng mã PSP... hoặc số điện thoại thay cho wallet account number.
payment.personal-qr.momo.wallet-account-number=${PAYMENT_PERSONAL_QR_MOMO_WALLET_ACCOUNT_NUMBER:99MMxxxxxxxxxxx}
payment.personal-qr.momo.vietqr-bank-bin=${PAYMENT_PERSONAL_QR_MOMO_VIETQR_BANK_BIN:970454}

payment.personal-qr.vnpay.enabled=${PAYMENT_PERSONAL_QR_VNPAY_ENABLED:true}
payment.personal-qr.vnpay.account-name=${PAYMENT_PERSONAL_QR_VNPAY_ACCOUNT_NAME:YOUR_BANK_ACCOUNT_NAME}
payment.personal-qr.vnpay.bank-name=${PAYMENT_PERSONAL_QR_VNPAY_BANK_NAME:YOUR_BANK_NAME}
payment.personal-qr.vnpay.account-number=${PAYMENT_PERSONAL_QR_VNPAY_ACCOUNT_NUMBER:YOUR_BANK_ACCOUNT_NUMBER}
payment.personal-qr.vnpay.vietqr-acquirer-id=${PAYMENT_PERSONAL_QR_VNPAY_VIETQR_ACQUIRER_ID:970436}