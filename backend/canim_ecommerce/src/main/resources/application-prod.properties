spring.application.name=canim_ecommerce

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/canim_ecommerce}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:db}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:canim_ecommerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.url=jdbc:mysql://${MYSQL_HOST:db}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:canim_ecommerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.flyway.user=${MYSQL_USER:root}
spring.flyway.password=${MYSQL_PASSWORD:root}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.ignore-migration-patterns=*:missing

security.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
security.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:10}
security.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:1}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.storage.mode=${APP_STORAGE_MODE:cloudinary}
app.storage.public-url=${APP_STORAGE_PUBLIC_URL:http://localhost:8080/canim_ecommerce/uploads}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s

order.pending-expiration-hours=${ORDER_PENDING_EXPIRATION_HOURS:24}
order.auto-cancel-fixed-delay-ms=${ORDER_AUTO_CANCEL_FIXED_DELAY_MS:300000}

payment.environment=${PAYMENT_ENV:sandbox}

payment.vnpay.enabled=${VNPAY_ENABLED:true}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:}
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
payment.vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/canim_ecommerce/payments/vnpay/ipn}

payment.momo.enabled=${MOMO_ENABLED:true}
payment.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.momo.endpoint=${MOMO_ENDPOINT:}
payment.momo.return-url=${MOMO_RETURN_URL:http://localhost:5173/payment/momo-return}
payment.momo.notify-url=${MOMO_NOTIFY_URL:http://localhost:8080/canim_ecommerce/payments/momo/notify}

payment.personal-qr.vietqr-template=${VIETQR_TEMPLATE:compact2}

payment.personal-qr.momo.enabled=${MOMO_QR_ENABLED:true}
payment.personal-qr.momo.account-name=${MOMO_QR_ACCOUNT_NAME:}
payment.personal-qr.momo.phone=${MOMO_QR_PHONE:}
payment.personal-qr.momo.wallet-account-number=${MOMO_QR_WALLET_ACCOUNT:}
payment.personal-qr.momo.vietqr-bank-bin=${MOMO_VIETQR_BANK_BIN:970454}

payment.personal-qr.vnpay.enabled=${VNPAY_QR_ENABLED:true}
payment.personal-qr.vnpay.account-name=${VNPAY_QR_ACCOUNT_NAME:}
payment.personal-qr.vnpay.bank-name=${VNPAY_QR_BANK_NAME:}
payment.personal-qr.vnpay.account-number=${VNPAY_QR_ACCOUNT_NUMBER:}
payment.personal-qr.vnpay.vietqr-acquirer-id=${VNPAY_VIETQR_ACQ_ID:970436}

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.enabled=${GOOGLE_MAPS_ENABLED:false}

app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

ai.service.base-url=${AI_SERVICE_BASE_URL:http://ai-service:8001}
