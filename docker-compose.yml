services:
  db:
    image: mysql:8.0
    container_name: canim_ecommerce_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-canim_ecommerce}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: canim_ecommerce_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  backend:
    build:
      context: ./backend/canim_ecommerce
      dockerfile: Dockerfile
    container_name: canim_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /canim_ecommerce

      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-canim_ecommerce}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:*}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

      PAYMENT_PERSONAL_QR_VIETQR_TEMPLATE: ${PAYMENT_PERSONAL_QR_VIETQR_TEMPLATE:-compact2}

      PAYMENT_PERSONAL_QR_MOMO_ENABLED: ${PAYMENT_PERSONAL_QR_MOMO_ENABLED:-true}
      PAYMENT_PERSONAL_QR_MOMO_ACCOUNT_NAME: ${PAYMENT_PERSONAL_QR_MOMO_ACCOUNT_NAME:-}
      PAYMENT_PERSONAL_QR_MOMO_PHONE: ${PAYMENT_PERSONAL_QR_MOMO_PHONE:-}
      PAYMENT_PERSONAL_QR_MOMO_WALLET_ACCOUNT_NUMBER: ${PAYMENT_PERSONAL_QR_MOMO_WALLET_ACCOUNT_NUMBER:-}
      PAYMENT_PERSONAL_QR_MOMO_VIETQR_BANK_BIN: ${PAYMENT_PERSONAL_QR_MOMO_VIETQR_BANK_BIN:-970454}

      PAYMENT_PERSONAL_QR_VNPAY_ENABLED: ${PAYMENT_PERSONAL_QR_VNPAY_ENABLED:-true}
      PAYMENT_PERSONAL_QR_VNPAY_ACCOUNT_NAME: ${PAYMENT_PERSONAL_QR_VNPAY_ACCOUNT_NAME:-}
      PAYMENT_PERSONAL_QR_VNPAY_BANK_NAME: ${PAYMENT_PERSONAL_QR_VNPAY_BANK_NAME:-}
      PAYMENT_PERSONAL_QR_VNPAY_ACCOUNT_NUMBER: ${PAYMENT_PERSONAL_QR_VNPAY_ACCOUNT_NUMBER:-}
      PAYMENT_PERSONAL_QR_VNPAY_VIETQR_ACQUIRER_ID: ${PAYMENT_PERSONAL_QR_VNPAY_VIETQR_ACQUIRER_ID:-970436}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db_data:
  redis_data: